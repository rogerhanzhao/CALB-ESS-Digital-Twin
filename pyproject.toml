[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calb-ess-digital-twin"
version = "0.1.0"
description = "CALB battery digital twin, ESS SOH simulation, and warranty analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pybamm>=24.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.scripts]
calb-fit-soh-baseline = "calb_ess_digital_twin.soh_engine.calibration_cli:main"
calb-extrapolate-soh = "calb_ess_digital_twin.soh_engine.extrapolation_cli:main"
calb-build-standard-exposure = "calb_ess_digital_twin.dispatch.exposure_cli:main"
calb-run-standard-study = "calb_ess_digital_twin.standard_study_cli:main"
calb-compare-standard-studies = "calb_ess_digital_twin.study_comparison_cli:main"
calb-build-dataset-revision = "calb_ess_digital_twin.cell_database.dataset_revision_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"
